services:
  api-seguridad:
    build:
      context: .
      dockerfile: Dockerfile
    image: apiappseguridad:latest
    container_name: api-seguridad
    restart: unless-stopped
    ports:
      - "6000:6000"
    env_file:
      - .env
    networks:
      - backend
      - crondocumentossri_default

networks:
  backend:
    driver: bridge
  # Red externa donde ya vive el contenedor cron-sri-mongo (Mongo).
  # No se crea aquí, ya existe porque la levantó el otro docker-compose.
  crondocumentossri_default:
    external: true